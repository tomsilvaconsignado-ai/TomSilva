<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90">
  <defs>
    <linearGradient id="logoBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066c0" />
      <stop offset="100%" stop-color="#003d73" />
    </linearGradient>
    <linearGradient id="logoAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Símbolo / Ícone do Jornal (Folha / Jornal Estilizado) -->
  <g transform="translate(6, 10)">
    <!-- Fundo circular / escudo dinâmico -->
    <rect x="0" y="2" width="66" height="66" rx="16" fill="url(#logoBlueGrad)" filter="url(#subtleShadow)" />
    
    <!-- Linhas do jornal / páginas dobradas estilizadas -->
    <!-- Página de fundo branca -->
    <path d="M16 16 L44 16 C47 16 49 18 49 21 L49 48 C49 51 47 53 44 53 L16 53 C13 53 11 51 11 48 L11 21 C11 18 13 16 16 16 Z" fill="#ffffff" fill-opacity="0.95" />
    
    <!-- Dobra do topo / cabeçalho do jornal em azul -->
    <path d="M17 22 L36 22 C37.5 22 38.5 22.8 38.5 24 C38.5 25.2 37.5 26 36 26 L17 26 C15.5 26 14.5 25.2 14.5 24 C14.5 22.8 15.5 22 17 22 Z" fill="#0056a4" />
    
    <!-- Linhas de texto representativas -->
    <rect x="15" y="30" width="22" height="3" rx="1.5" fill="#94a3b8" />
    <rect x="15" y="36" width="28" height="3" rx="1.5" fill="#94a3b8" />
    <rect x="15" y="42" width="18" height="3" rx="1.5" fill="#94a3b8" />
    
    <!-- Selo circular vermelho / sinalizador de notícias em tempo real -->
    <circle cx="49" cy="20" r="8" fill="url(#logoAccentGrad)" stroke="#ffffff" stroke-width="2.5" />
    <!-- Ponto branco central -->
    <circle cx="49" cy="20" r="2.5" fill="#ffffff" />
    
    <!-- Arco dinâmico de sinal / conectividade -->
    <path d="M42 49 C46 53 52 54 57 52" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>

  <!-- Tipografia Principal: FOLHA DA REGIÃO -->
  <g transform="translate(86, 0)">
    <!-- Linha Superior: FOLHA em azul destaque -->
    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="38" letter-spacing="-0.03em" fill="#0056a4">
      FOLHA
    </text>

    <!-- DA REGIÃO em cinza escuro / preto moderno -->
    <text x="138" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="38" letter-spacing="-0.03em" fill="#1e293b">
      DA REGIÃO
    </text>

    <!-- Selo ONLINE / DIGITAL -->
    <g transform="translate(362, 24)">
      <rect x="0" y="0" width="46" height="18" rx="4" fill="url(#logoAccentGrad)" />
      <text x="23" y="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="9" fill="#ffffff" text-anchor="middle" letter-spacing="0.1em">
        ONLINE
      </text>
    </g>

    <!-- Linha de Subtítulo / Slogan Institucional -->
    <text x="2" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10.5" letter-spacing="0.22em" fill="#64748b" text-transform="uppercase">
      SERGIPE • O PORTAL DE NOTÍCIAS
    </text>

    <!-- Linha de acento sutil azul/vermelha sob o texto -->
    <line x1="0" y1="76" x2="330" y2="76" stroke="#e2e8f0" stroke-width="1.5" />
    <line x1="0" y1="76" x2="70" y2="76" stroke="#0056a4" stroke-width="2.5" stroke-linecap="round" />
    <line x1="75" y1="76" x2="95" y2="76" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
